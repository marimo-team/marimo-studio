packages:
  - apps/*
  - packages/*

publicHoistPattern:
  - vue
  - "@vue/*"
  - "@vueuse/*"
  - vitepress

catalogMode: prefer

catalog:
  "@marimo-team/marimo-export": 0.0.6
  "@playwright/test": 1.61.1
  "@codemirror/lang-css": ^6.3.1
  "@codemirror/lang-html": ^6.4.9
  "@codemirror/state": 6.7.1
  "@testing-library/jest-dom": 6.9.1
  "@testing-library/react": 16.3.2
  "@testing-library/user-event": 14.6.1
  "@types/node": ^22.20.1
  "@types/react": ^19.2.10
  "@types/react-dom": ^19.2.3
  "@uiw/react-codemirror": 4.25.4
  "@uwdata/flechette": 2.5.0
  "@unocss/core": 66.7.5
  "@unocss/preset-wind4": 66.7.5
  htmx.org: 2.0.10
  iconify-icon: 2.3.0
  jsdom: 29.1.1
  jotai: ^2.17.0
  lucide-react: 0.563.0
  react: ^19.2.4
  react-dom: ^19.2.4
  typescript: ^6.0.3
  tsx: 4.21.0
  vite: npm:@voidzero-dev/vite-plus-core@0.3.0
  vite-plus: 0.3.0
  vitepress: 2.0.0-alpha.19
  vue: ^3.5.39
  zod: 4.3.6
  css-tree: 3.2.1
  "@types/css-tree": 2.3.11
  oxlint: 1.76.0
  "@oxlint/plugins": 1.76.0
  oxlint-tsgolint: 7.0.2001
  "@codemirror/lang-javascript": 6.2.5
  "@codemirror/language": 6.12.4
  "@iconify/vue": 5.0.1
  portless: 0.15.5

overrides:
  nanoid: 3.3.18
  postcss: 8.5.25
  undici: 7.29.0
  vite: "catalog:"
  vitepress>vite: 8.2.0

peerDependencyRules:
  allowAny:
    - vite
  allowedVersions:
    vite: "*"

allowBuilds:
  "@swc/core": true
  esbuild: true

minimumReleaseAge: 10080
verifyDepsBeforeRun: install
blockExoticSubdeps: true
trustPolicy: no-downgrade
trustPolicyExclude:
  - undici-types@6.21.0
onlyBuiltDependencies: []
minimumReleaseAgeExclude:
  - nanoid@3.3.18
  - "@marimo-team/*"
