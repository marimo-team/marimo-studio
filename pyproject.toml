[tool.uv.workspace]
members = ["apps/e2e/fixtures-provider/provider", "packages/marimo-studio"]

[dependency-groups]
test = [
  "httpx2>=2.9",
  "pandas==2.3.3",
  "polars>=1.42",
  "pyarrow==25.0.0",
  "pytest>=9.1",
  "pytest-xdist==3.8.0",
]
test-deno = [{ include-group = "test" }, "deno==2.9.5"]
dev = [
  { include-group = "test" },
  "agent-plugins>=0.2",
  "basedpyright==1.39.10",
  "deno==2.9.5",
  "marimo[recommended]==0.24.2",
  "pyrefly>=1.1",
  "ruff>=0.16",
  "tomli==2.3.1",
  "ty>=0.0.64",
]
e2e = ["anywidget", "marimo-lens==0.0.10", "marimo-studio-e2e-provider"]
marimo-studio-build = ["agent-plugins>=0.2", "uv-build==0.12.2"]
release = ["twine==6.2.0"]

[tool.pytest.ini_options]
addopts = "--strict-markers"
testpaths = ["packages/marimo-studio/tests"]
markers = [
  "deno: executes or validates the pinned Deno provider runtime",
  "native_process: spawns native processes or validates operating-system process ownership",
  "requires_node: executes JavaScript through the pinned Node.js runtime",
  "supported_python: validates a contract across the supported Python and platform matrix",
]

[tool.ty.src]
include = ["packages/marimo-studio/src", "packages/marimo-studio/tests"]

[tool.pyrefly]
project-includes = ["packages/marimo-studio/src/**/*.py", "packages/marimo-studio/tests/**/*.py"]
search-path = ["packages/marimo-studio/src", "packages/marimo-studio/tests"]

[tool.basedpyright]
include = ["packages/marimo-studio/src", "packages/marimo-studio/tests", "scripts"]
extraPaths = ["packages/marimo-studio/src", "packages/marimo-studio/tests"]
pythonVersion = "3.10"
pythonPlatform = "All"
typeCheckingMode = "recommended"
failOnWarnings = false
reportImplicitStringConcatenation = false
reportConstantRedefinition = false

[[tool.basedpyright.executionEnvironments]]
root = "packages/marimo-studio/tests"
pythonVersion = "3.11"
reportAny = false
reportExplicitAny = false
reportInvalidCast = false
reportMissingParameterType = false
reportMissingTypeStubs = false
reportPrivateUsage = false
reportPrivateImportUsage = false
reportPrivateLocalImportUsage = false
reportUnannotatedClassAttribute = false
reportUninitializedInstanceVariable = false
reportUnknownArgumentType = false
reportUnknownLambdaType = false
reportUnknownMemberType = false
reportUnknownParameterType = false
reportUnknownVariableType = false
reportUnusedCallResult = false

[[tool.basedpyright.executionEnvironments]]
root = "packages/marimo-studio/src/marimo_studio/_compat"
reportAny = false
reportExplicitAny = false
reportInvalidCast = false
reportMissingParameterType = false
reportMissingTypeArgument = false
reportMissingTypeStubs = false
reportPrivateUsage = false
reportPrivateImportUsage = false
reportUnannotatedClassAttribute = false
reportUnknownArgumentType = false
reportUnknownLambdaType = false
reportUnknownMemberType = false
reportUnknownParameterType = false
reportUnknownVariableType = false

[[tool.basedpyright.executionEnvironments]]
root = "scripts"
pythonVersion = "3.11"
reportPrivateUsage = false
reportPrivateLocalImportUsage = false

[[tool.basedpyright.executionEnvironments]]
root = "packages/marimo-studio/src"

[tool.uv]
required-version = ">=0.12,<0.13"
exclude-newer = "7 days"
exclude-newer-package = { agent-plugins = false, marimo = false, marimo-export = false, marimo-lens = false, marimo-studio = false }

[tool.uv.sources]
marimo-studio = { workspace = true }
marimo-studio-e2e-provider = { workspace = true }
