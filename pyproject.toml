[project]
name = "marimo-studio"
version = "0.1.0"
description = "Design custom views for Marimo notebooks"
readme = "README.md"
authors = [
    { name = "Péter Ferenc Gyarmati", email = "dev.petergy@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "htpy>=26.5.1,<27",
    "marimo==0.23.15",
    "markupsafe>=3",
    "packaging>=25",
    "tomlkit>=0.14",
]

[project.urls]
Homepage = "https://peter-gy.github.io/marimo-studio/"
Documentation = "https://peter-gy.github.io/marimo-studio/"
Repository = "https://github.com/peter-gy/marimo-studio"
Issues = "https://github.com/peter-gy/marimo-studio/issues"

[project.scripts]
marimo-studio = "marimo_studio.cli:main"

[project.entry-points."marimo.server.asgi.middleware"]
marimo-studio = "marimo_studio._entrypoints:server_middleware"

[project.entry-points."marimo.kernel.lifespan"]
marimo-studio = "marimo_studio._entrypoints:kernel_lifespan"

[build-system]
requires = ["uv_build>=0.11.32,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
test = [
    "httpx2==2.9.1",
    "pytest==9.1.1",
]
dev = [
    { include-group = "test" },
    "deno>=2.9.4",
    "marimo[recommended]==0.23.15",
    "pyrefly>=1.1.1",
    "ruff>=0.16.0",
    "ty>=0.0.64",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.ty.src]
include = ["src", "tests"]

[tool.pyrefly]
project-includes = ["src/**/*.py", "tests/**/*.py"]
search-path = ["src", "tests"]
