[tool.uv.workspace]
members = ["packages/marimo-studio"]

[dependency-groups]
test = ["httpx2==2.9.1", "polars==1.43.2", "pytest==9.1.1"]
dev = [
  { include-group = "test" },
  "marimo[recommended]>=0.23.16",
  "pyrefly>=1.1.1",
  "ruff>=0.16.0",
  "ty>=0.0.64",
]

[tool.pytest.ini_options]
testpaths = ["packages/marimo-studio/tests"]

[tool.ty.src]
include = ["packages/marimo-studio/src", "packages/marimo-studio/tests"]

[tool.pyrefly]
project-includes = ["packages/marimo-studio/src/**/*.py", "packages/marimo-studio/tests/**/*.py"]
search-path = ["packages/marimo-studio/src", "packages/marimo-studio/tests"]
