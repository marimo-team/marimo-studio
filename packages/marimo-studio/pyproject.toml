[project]
name = "marimo-studio"
version = "0.1.0"
description = "Custom views for Marimo notebooks"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Péter Ferenc Gyarmati", email = "dev.petergy@gmail.com" }]
requires-python = ">=3.10,<3.15"
dependencies = [
  "agent-plugins>=0.1.0",
  "click>=8.2",
  "htpy>=26.5.1,<27",
  "marimo==0.24.0",
  "marimo-export==0.1.0",
  "markupsafe>=3",
  "packaging>=25",
  "tomli>=2; python_version < '3.11'",
  "tomlkit>=0.14",
  "tree-sitter==0.25.2",
  "tree-sitter-javascript==0.25.0",
  "watchdog==6.0.0",
]

[project.optional-dependencies]
deno = ["deno==2.9.5"]

[project.urls]
Homepage = "https://marimo-team.github.io/marimo-studio/"
Documentation = "https://marimo-team.github.io/marimo-studio/"
Repository = "https://github.com/marimo-team/marimo-studio"
Issues = "https://github.com/marimo-team/marimo-studio/issues"

[project.scripts]
marimo-studio = "marimo_studio._cli:main"

[project.entry-points."marimo.server.asgi.middleware"]
marimo-studio = "marimo_studio._entrypoints:server_middleware"

[project.entry-points."marimo.kernel.lifespan"]
marimo-studio = "marimo_studio._entrypoints:kernel_lifespan"

[project.entry-points."marimo.agent.capability"]
studio = "marimo_studio.agent"

[project.entry-points."marimo_studio.view_provider"]
react = "marimo_studio.view_providers._bundled.deno_react:provider"
svelte = "marimo_studio.view_providers._bundled.deno_svelte:provider"
vanilla = "marimo_studio.view_providers._bundled.vanilla:provider"

[tool.ruff]
src = ["src"]
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF", "TID251"]

[tool.ruff.lint.flake8-tidy-imports.banned-api]
"marimo._ast" = { msg = "Private Marimo imports belong in marimo_studio._compat" }
"marimo._cli" = { msg = "Private Marimo imports belong in marimo_studio._compat" }
"marimo._code_mode" = { msg = "Private Marimo imports belong in marimo_studio._compat" }
"marimo._config" = { msg = "Private Marimo imports belong in marimo_studio._compat" }
"marimo._messaging" = { msg = "Private Marimo imports belong in marimo_studio._compat" }
"marimo._output" = { msg = "Private Marimo imports belong in marimo_studio._compat" }
"marimo._plugins" = { msg = "Private Marimo imports belong in marimo_studio._compat" }
"marimo._runtime" = { msg = "Private Marimo imports belong in marimo_studio._compat" }
"marimo._save" = { msg = "Private Marimo imports belong in marimo_studio._compat" }
"marimo._schemas" = { msg = "Private Marimo imports belong in marimo_studio._compat" }
"marimo._server" = { msg = "Private Marimo imports belong in marimo_studio._compat" }
"marimo._session" = { msg = "Private Marimo imports belong in marimo_studio._compat" }
"marimo._types" = { msg = "Private Marimo imports belong in marimo_studio._compat" }
"marimo._utils" = { msg = "Private Marimo imports belong in marimo_studio._compat" }
"marimo_studio._compat" = { msg = "Compose compatibility adapters at an application or server boundary" }

[tool.ruff.lint.per-file-ignores]
"src/marimo_studio/_compat/**/*.py" = ["TID251"]
"src/marimo_studio/_composition.py" = ["TID251"]
"tests/app_helpers.py" = ["TID251"]
"tests/conftest.py" = ["TID251"]
"tests/agent/test_browser_activation_observation.py" = ["TID251"]
"tests/agent/test_browser_validation_http.py" = ["TID251"]
"tests/agent/test_client_connection.py" = ["TID251"]
"tests/agent/test_code_mode_bridge.py" = ["TID251"]
"tests/agent/test_workspace.py" = ["TID251"]
"tests/marimo_compat/**/*.py" = ["TID251"]
"tests/projections/test_authorization.py" = ["TID251"]
"tests/server/app_test_support.py" = ["TID251"]
"tests/server/test_context.py" = ["TID251"]
"tests/server/test_delivery_directory_routes.py" = ["TID251"]
"tests/server/test_editor_runtime_assets.py" = ["TID251"]
"tests/server/test_kiosk_sessions.py" = ["TID251"]
"tests/server/test_peer_controls.py" = ["TID251"]
"tests/server/test_presentation_runtime.py" = ["TID251"]
"tests/server/test_projection_api.py" = ["TID251"]
"tests/server/test_runtime_config.py" = ["TID251"]
"tests/server/test_session_startup.py" = ["TID251"]
"tests/views/test_runtime_validation.py" = ["TID251"]
"tests/views/test_view_setup.py" = ["TID251"]
"tests/views/test_workspace_catalog.py" = ["TID251"]
"tests/views/test_workspace_binding_ownership.py" = ["TID251"]
"tests/views/test_workspace_configuration.py" = ["TID251"]
"tests/views/test_workspace_deletion_lifecycle.py" = ["TID251"]
"tests/views/test_workspace_security.py" = ["TID251"]

[build-system]
requires = ["agent-plugins>=0.1.0", "uv_build==0.12.2"]
build-backend = "agent_plugins.build.uv_build"

[tool.agent-plugins]
root = "../.."
