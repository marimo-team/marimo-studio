name: Set up JavaScript workspace
description: Install the pinned Node.js toolchain and locked pnpm workspace.

inputs:
  prepare-marimo-frontend:
    description: Prepare the pinned Marimo frontend sources.
    required: false
    default: "false"

runs:
  using: composite
  steps:
    - name: Set up Socket Firewall
      uses: socketdev/action@ba6de6cc0565af1f42295590380973573297e31f # v1.3.2
      with:
        mode: firewall-free

    - name: Set up Vite+
      uses: voidzero-dev/setup-vp@250f29ce396baf5e8f24498e17c0dfdebabc26eb # v1.15.0
      with:
        node-version-file: .node-version
        version: 0.2.4
        cache: true
        sfw: true
        run-install: |
          - args: ["--frozen-lockfile"]

    - name: Enable pnpm
      shell: bash
      run: corepack enable pnpm

    - name: Prepare the pinned Marimo frontend
      if: inputs.prepare-marimo-frontend == 'true'
      shell: bash
      run: make _prepare-frontend
