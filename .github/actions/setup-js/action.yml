name: Set up JavaScript workspace
description: Install the supported Node.js toolchain and locked pnpm workspace.

inputs:
  prepare-marimo-frontend:
    description: Prepare the pinned Marimo frontend sources.
    required: false
    default: "false"

runs:
  using: composite
  steps:
    - name: Set up Socket Firewall
      if: runner.os != 'Windows'
      uses: socketdev/action@ba6de6cc0565af1f42295590380973573297e31f # v1.3.2
      with:
        mode: firewall-free
        firewall-version: "1.15.0"

    - name: Set up Vite+
      uses: voidzero-dev/setup-vp@1b32467adbe183473499fd9d5d372c3ed9641754 # v1.18.0
      with:
        node-version-file: package.json
        version: 0.3.0
        cache: true
        sfw: true
        run-install: |
          - args: ["--frozen-lockfile"]

    - name: Enable pnpm
      shell: bash
      run: corepack enable pnpm

    - name: Prepare the pinned Marimo frontend
      if: inputs.prepare-marimo-frontend == 'true'
      shell: bash
      run: make _prepare-frontend
