name: Set up pixi
description: Install pixi and the repository's locked environment of system tools.

runs:
  using: composite
  steps:
    - name: Set up pixi
      uses: prefix-dev/setup-pixi@d3f436a425481402e6a95a1d1fc10331c708cd9e # v0.10.2
      with:
        pixi-version: v0.81.0
        locked: true
        cache: true
        cache-write: ${{ github.event_name == 'push' && github.ref_name == 'main' }}
        # Make and scripts/python-test.sh activate the environment through
        # `pixi run` for the commands that need its tools.
        activate-environment: false
