name: Test Python
description: Run one repository-owned Python test profile.

inputs:
  profile:
    description: Python test profile to run.
    required: true
  python-version:
    description: Python version to test.
    required: true

runs:
  using: composite
  steps:
    - name: Set up uv and Python
      uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      with:
        enable-cache: true
        cache-dependency-glob: uv.lock
        python-version: ${{ inputs.python-version }}

    - name: Run Python test profile
      shell: bash
      run: |
        parallel=()
        if [[ "${{ runner.os }}" != "Linux" && "${{ inputs.profile }}" != "supported-python" ]]; then
          parallel+=(--parallel)
        fi
        ./scripts/python-test.sh \
          --profile "${{ inputs.profile }}" \
          --python "${{ inputs.python-version }}" \
          "${parallel[@]}" \
          -- -rs --durations=30 --junitxml="$RUNNER_TEMP/python-results.xml"
    - name: Upload Python results
      if: ${{ !cancelled() }}
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      with:
        name: python-${{ inputs.profile }}-${{ inputs.python-version }}-${{ runner.os }}
        path: ${{ runner.temp }}/python-results.xml
        retention-days: 7
        if-no-files-found: warn
