name: Select validation evidence
description: Choose complete validation, changed-file validation, or exact-tree reuse.

inputs:
  workflow:
    description: Workflow filename to inspect.
    required: true
  reuse:
    description: Reuse successful exact-tree PR evidence after merge.
    required: false
    default: "true"

outputs:
  mode:
    description: "Validation mode: full, changed, or reuse."
    value: ${{ steps.resolve.outputs.mode }}

runs:
  using: composite
  steps:
    - name: Record the tested pull request tree
      id: tested-tree
      if: github.event_name == 'pull_request' && inputs.reuse == 'true'
      shell: bash
      run: |
        tree="$(git rev-parse 'HEAD^{tree}')"
        if [[ ! "$tree" =~ ^([0-9a-f]{40}|[0-9a-f]{64})$ ]]; then
          echo "The checked-out Git tree is invalid." >&2
          exit 1
        fi
        path="$RUNNER_TEMP/pr-validation-tree"
        printf '%s\n' "$tree" > "$path"
        printf 'path=%s\n' "$path" >> "$GITHUB_OUTPUT"

    - name: Publish the tested pull request tree
      if: github.event_name == 'pull_request' && inputs.reuse == 'true'
      continue-on-error: true
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: pr-validation-tree
        path: ${{ steps.tested-tree.outputs.path }}
        overwrite: true
        retention-days: 7
        if-no-files-found: error

    - name: Resolve validation evidence
      id: resolve
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        VALIDATION_WORKFLOW: ${{ inputs.workflow }}
        VALIDATION_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        VALIDATION_REUSE: ${{ inputs.reuse }}
      run: "$GITHUB_ACTION_PATH/resolve.sh"
