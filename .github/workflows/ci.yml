name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    name: Changes
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      pull-requests: read
    outputs:
      distribution: ${{ steps.selection.outputs.distribution }}
      frontend_contracts: ${{ steps.selection.outputs.frontend_contracts }}
      installed_distribution: ${{ steps.selection.outputs.installed_distribution }}
      python_contracts: ${{ steps.selection.outputs.python_contracts }}
      quality: ${{ steps.selection.outputs.quality }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Find validation for the merged tree
        id: pr-validation
        uses: ./.github/actions/pr-validation
        with:
          workflow: ci.yml

      - name: Classify changed files
        id: filter
        if: steps.pr-validation.outputs.mode == 'changed'
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          filters: .github/filters.yml
          predicate-quantifier: some-with-excludes
      - name: Select required contracts
        id: selection
        env:
          VALIDATION_MODE: ${{ steps.pr-validation.outputs.mode }}
          VALIDATION_FILTERS: '["distribution","frontend_contracts","installed_distribution","python_contracts","quality"]'
          PATH_FILTERS_JSON: ${{ toJSON(steps.filter.outputs) }}
        run: node .github/actions/pr-validation/select.mjs

  quality:
    name: Quality
    needs: changes
    if: >-
      needs.changes.outputs.quality == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up uv and Python
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
          python-version: "3.12"

      - name: Install Python dependencies
        run: uv sync --locked

      - name: Set up JavaScript workspace
        uses: ./.github/actions/setup-js
        with:
          prepare-marimo-frontend: "true"

      - name: Lint
        run: make lint

      - name: Type-check
        run: make typecheck

  python-standard:
    name: Standard Python contracts
    needs: changes
    if: >-
      needs.changes.outputs.python_contracts == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Test standard Python contracts
        uses: ./.github/actions/test-python
        with:
          profile: standard
          python-version: "3.12"

  frontend:
    name: Frontend contracts
    needs: changes
    if: >-
      needs.changes.outputs.frontend_contracts == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install Python dependencies
        run: uv sync --locked

      - name: Set up JavaScript workspace
        uses: ./.github/actions/setup-js
        with:
          prepare-marimo-frontend: "true"

      - name: Test frontend
        shell: bash
        run: make frontend-test 2>&1 | tee "$RUNNER_TEMP/frontend-tests.log"
      - name: Upload frontend phase timings
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: frontend-test-timings
          path: ${{ runner.temp }}/frontend-tests.log
          retention-days: 7
          if-no-files-found: warn

  package:
    name: Package candidate
    needs: changes
    if: >-
      needs.changes.outputs.distribution == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up uv and Python
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
          python-version: "3.12"

      - name: Install Python dependencies
        run: uv sync --locked

      - name: Set up JavaScript workspace
        uses: ./.github/actions/setup-js
        with:
          prepare-marimo-frontend: "true"

      - name: Build and validate package archives
        run: make _package-build

      - name: Upload package candidate
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: package-candidate
          path: |
            dist/marimo_studio-*.whl
            dist/agent-plugin-digests.json
          retention-days: 1
          if-no-files-found: error

  python-compat:
    name: Supported Python ${{ matrix.python-version }} (${{ matrix.os }})
    needs: changes
    if: >-
      needs.changes.outputs.python_contracts == 'true'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.10", "3.11", "3.13", "3.14"]
        include:
          - os: windows-latest
            python-version: "3.12"
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Test supported Python contracts
        uses: ./.github/actions/test-python
        with:
          profile: supported-python
          python-version: ${{ matrix.python-version }}

  native-process:
    name: Native process ownership (${{ matrix.os }})
    needs: changes
    if: >-
      needs.changes.outputs.python_contracts == 'true'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Test process and cancellation ownership
        uses: ./.github/actions/test-python
        with:
          profile: native
          python-version: "3.12"

  deno:
    name: Deno providers (${{ matrix.os }})
    needs: changes
    if: >-
      needs.changes.outputs.python_contracts == 'true'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Test Deno provider contracts
        uses: ./.github/actions/test-python
        with:
          profile: deno
          python-version: "3.12"

  installed-package:
    name: Installed package and provider (${{ matrix.os }})
    needs: [changes, package]
    if: >-
      needs.changes.outputs.distribution == 'true' && needs.package.result == 'success'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os:
          ${{ fromJSON(needs.changes.outputs.installed_distribution == 'true' && '["ubuntu-latest",
          "macos-latest", "windows-latest"]' || '["ubuntu-latest"]') }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Download package candidate
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: package-candidate
          path: dist

      - name: Verify installed package and providers
        shell: bash
        run: ./scripts/verify-installed-wheel.sh 2>&1 | tee "$RUNNER_TEMP/installed-verification.log"
      - name: Upload installed verification timings
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: installed-verification-${{ matrix.os }}
          path: ${{ runner.temp }}/installed-verification.log
          retention-days: 7
          if-no-files-found: warn

  gate:
    name: CI gate
    if: always()
    needs:
      - changes
      - quality
      - python-standard
      - frontend
      - package
      - python-compat
      - native-process
      - deno
      - installed-package
    runs-on: ubuntu-latest
    timeout-minutes: 1
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Confirm CI results
        env:
          CHANGES: ${{ needs.changes.result }}
          DENO_REQUIRED: ${{ needs.changes.outputs.python_contracts == 'true' }}
          DENO: ${{ needs.deno.result }}
          FRONTEND_REQUIRED: ${{ needs.changes.outputs.frontend_contracts == 'true' }}
          FRONTEND: ${{ needs.frontend.result }}
          INSTALLED_PACKAGE_REQUIRED: ${{ needs.changes.outputs.distribution == 'true' && needs.package.result == 'success' }}
          INSTALLED_PACKAGE: ${{ needs.installed-package.result }}
          NATIVE_PROCESS_REQUIRED: ${{ needs.changes.outputs.python_contracts == 'true' }}
          NATIVE_PROCESS: ${{ needs.native-process.result }}
          PACKAGE_REQUIRED: ${{ needs.changes.outputs.distribution == 'true' }}
          PACKAGE: ${{ needs.package.result }}
          PYTHON_COMPAT_REQUIRED: ${{ needs.changes.outputs.python_contracts == 'true' }}
          PYTHON_COMPAT: ${{ needs.python-compat.result }}
          PYTHON_STANDARD_REQUIRED: ${{ needs.changes.outputs.python_contracts == 'true' }}
          PYTHON_STANDARD: ${{ needs.python-standard.result }}
          QUALITY_REQUIRED: ${{ needs.changes.outputs.quality == 'true' }}
          QUALITY: ${{ needs.quality.result }}
        run: |
          scripts/check-workflow-results.sh \
            Changes true "$CHANGES" \
            Deno "$DENO_REQUIRED" "$DENO" \
            Frontend "$FRONTEND_REQUIRED" "$FRONTEND" \
            Installed-package "$INSTALLED_PACKAGE_REQUIRED" "$INSTALLED_PACKAGE" \
            Native-process "$NATIVE_PROCESS_REQUIRED" "$NATIVE_PROCESS" \
            Package "$PACKAGE_REQUIRED" "$PACKAGE" \
            Python-compat "$PYTHON_COMPAT_REQUIRED" "$PYTHON_COMPAT" \
            Python-standard "$PYTHON_STANDARD_REQUIRED" "$PYTHON_STANDARD" \
            Quality "$QUALITY_REQUIRED" "$QUALITY"
