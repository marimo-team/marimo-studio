name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up uv and Python
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
          python-version: "3.12"

      - name: Install Python dependencies
        run: uv sync --locked

      - name: Set up JavaScript workspace
        uses: ./.github/actions/setup-js
        with:
          prepare-marimo-frontend: "true"

      - name: Lint
        run: make lint

      - name: Type-check
        run: make typecheck

      - name: Test standard Python contracts
        run: ./scripts/python-test.sh --profile standard --python 3.12

      - name: Test frontend
        run: make frontend-test

      - name: Build package
        run: make package

      - name: Upload the verified wheel for Windows
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: verified-package
          path: |
            dist/marimo_studio-*.whl
            dist/agent-plugin-digests.json
          retention-days: 1
          if-no-files-found: error

  python-compat:
    name: Supported Python ${{ matrix.python-version }} (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.10", "3.11", "3.13", "3.14"]
        include:
          - os: windows-latest
            python-version: "3.12"
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Test supported Python contracts
        uses: ./.github/actions/test-python
        with:
          profile: supported-python
          python-version: ${{ matrix.python-version }}

  native-process:
    name: Native process ownership (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Test process and cancellation ownership
        uses: ./.github/actions/test-python
        with:
          profile: native
          python-version: "3.12"

  deno:
    name: Deno providers (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Test Deno provider contracts
        uses: ./.github/actions/test-python
        with:
          profile: deno
          python-version: "3.12"

  installed-package:
    name: Installed package and provider (Windows)
    needs: quality
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Download the verified wheel
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: verified-package
          path: dist

      - name: Verify installed package and providers
        shell: bash
        run: ./scripts/verify-installed-wheel.sh
