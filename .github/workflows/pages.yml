name: GitHub Pages

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    name: Changes
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      documentation: ${{ steps.filter.outputs.documentation }}
      pages: ${{ steps.filter.outputs.pages }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Classify changed files
        id: filter
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          filters: .github/filters.yml
          predicate-quantifier: some-with-excludes

  documentation:
    name: Documentation contracts
    needs: changes
    if: >-
      github.event_name == 'workflow_dispatch' ||
      needs.changes.outputs.documentation == 'true' ||
      needs.changes.outputs.pages == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up JavaScript workspace
        uses: ./.github/actions/setup-js

      - name: Check documentation formatting
        run: >-
          pnpm exec vp fmt --check
          README.md
          AGENTS.md
          CLAUDE.md
          CONTRIBUTING.md
          LICENSE
          SECURITY.md
          .github/release-notes
          apps/docs
          development_docs
          docs
          examples
          packages/marimo-studio/README.md
          skills/marimo-studio

      - name: Lint documentation sources
        run: pnpm exec vp lint apps/docs

      - name: Lint example frontend sources
        run: pnpm exec oxlint examples --no-ignore

      - name: Type-check documentation sources
        run: >-
          pnpm exec vp check --no-fmt --no-lint
          apps/docs/.vitepress
          apps/docs/scripts

      - name: Set up uv and Python
        if: github.event_name == 'workflow_dispatch' || needs.changes.outputs.pages == 'true'
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
          python-version: "3.12"

      - name: Test documented Python contracts
        if: github.event_name == 'workflow_dispatch' || needs.changes.outputs.pages == 'true'
        run: >-
          ./scripts/python-test.sh --profile standard --python 3.12 --
          packages/marimo-studio/tests/cli/test_documentation_examples.py

  build:
    needs: [changes, documentation]
    if: github.event_name == 'workflow_dispatch' || needs.changes.outputs.pages == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    outputs:
      publish: ${{ steps.latest.outputs.publish }}
    env:
      MARIMO_EXPORT_REPOSITORY: ${{ github.workspace }}/.cache/marimo-export-repository
    permissions:
      contents: read
      pages: read
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Restore prepared notebook states
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.MARIMO_EXPORT_REPOSITORY }}
          key: marimo-export-v1-${{ runner.os }}-${{ hashFiles('uv.lock') }}-${{ github.sha }}
          restore-keys: |
            marimo-export-v1-${{ runner.os }}-${{ hashFiles('uv.lock') }}-

      - name: Set up uv and Python
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
          python-version: "3.12"

      - name: Set up JavaScript workspace
        uses: ./.github/actions/setup-js
        with:
          prepare-marimo-frontend: "true"

      - name: Configure GitHub Pages
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        id: pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Build documentation
        env:
          BASE_PATH: ${{ steps.pages.outputs.base_path }}
        run: make docs-build

      - name: Confirm this commit is still the tip of main
        id: latest
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        env:
          COMMIT_SHA: ${{ github.sha }}
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          latest_sha="$(gh api "repos/$REPOSITORY/git/ref/heads/main" --jq '.object.sha')"
          if [[ ! "$latest_sha" =~ ^([0-9a-f]{40}|[0-9a-f]{64})$ ]]; then
            echo "The current main commit could not be resolved." >&2
            exit 1
          fi
          if [[ "$latest_sha" == "$COMMIT_SHA" ]]; then
            echo "publish=true" >> "$GITHUB_OUTPUT"
          else
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Skipping deployment because main advanced to $latest_sha."
          fi

      - name: Upload GitHub Pages artifact
        if: steps.latest.outputs.publish == 'true'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          include-hidden-files: true
          path: apps/docs/.vitepress/dist

  deploy:
    if: needs.build.outputs.publish == 'true'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: marimo-studio-pages-deploy
      cancel-in-progress: false
      queue: max
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Confirm this commit is still the tip of main
        id: latest
        env:
          COMMIT_SHA: ${{ github.sha }}
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          latest_sha="$(gh api "repos/$REPOSITORY/git/ref/heads/main" --jq '.object.sha')"
          if [[ ! "$latest_sha" =~ ^([0-9a-f]{40}|[0-9a-f]{64})$ ]]; then
            echo "The current main commit could not be resolved." >&2
            exit 1
          fi
          if [[ "$latest_sha" == "$COMMIT_SHA" ]]; then
            echo "deploy=true" >> "$GITHUB_OUTPUT"
          else
            echo "deploy=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Skipping deployment because main advanced to $latest_sha."
          fi

      - name: Deploy to GitHub Pages
        if: steps.latest.outputs.deploy == 'true'
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0

  gate:
    name: Documentation gate
    if: always()
    needs: [changes, documentation, build, deploy]
    runs-on: ubuntu-latest
    timeout-minutes: 1
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Confirm documentation results
        env:
          BUILD_REQUIRED: ${{ (github.event_name == 'workflow_dispatch' || needs.changes.outputs.pages == 'true') && needs.documentation.result == 'success' }}
          BUILD: ${{ needs.build.result }}
          CHANGES: ${{ needs.changes.result }}
          DEPLOY_REQUIRED: ${{ needs.build.outputs.publish == 'true' }}
          DEPLOY: ${{ needs.deploy.result }}
          DOCUMENTATION_REQUIRED: ${{ github.event_name == 'workflow_dispatch' || needs.changes.outputs.documentation == 'true' || needs.changes.outputs.pages == 'true' }}
          DOCUMENTATION: ${{ needs.documentation.result }}
        run: |
          scripts/check-workflow-results.sh \
            Changes true "$CHANGES" \
            Documentation "$DOCUMENTATION_REQUIRED" "$DOCUMENTATION" \
            Build "$BUILD_REQUIRED" "$BUILD" \
            Deploy "$DEPLOY_REQUIRED" "$DEPLOY"
