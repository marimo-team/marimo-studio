name: GitHub Pages

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pages: write
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Socket Firewall
        uses: socketdev/action@ba6de6cc0565af1f42295590380973573297e31f # v1.3.2
        with:
          mode: firewall-free

      - name: Set up Vite+
        uses: voidzero-dev/setup-vp@250f29ce396baf5e8f24498e17c0dfdebabc26eb # v1.15.0
        with:
          node-version-file: .node-version
          version: 0.2.4
          cache: true
          sfw: true
          run-install: |
            - args: ["--frozen-lockfile"]

      - name: Enable pnpm
        run: corepack enable pnpm

      - name: Configure GitHub Pages
        if: github.event_name != 'pull_request'
        id: pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Build documentation
        env:
          BASE_PATH: ${{ steps.pages.outputs.base_path }}
        run: make docs-build

      - name: Check GitHub Pages paths
        env:
          BASE_PATH: ${{ steps.pages.outputs.base_path }}
        run: |
          index="apps/docs/.vitepress/dist/index.html"
          test -f apps/docs/.vitepress/dist/getting-started.html
          test -f apps/docs/.vitepress/dist/reference.html
          grep -q "href=\"${BASE_PATH}/assets/" "$index"
          grep -q "src=\"${BASE_PATH}/assets/" "$index"
          grep -q "href=\"${BASE_PATH}/favicon.svg\"" "$index"
          grep -q "href=\"${BASE_PATH}/getting-started\"" "$index"

      - name: Upload GitHub Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: apps/docs/.vitepress/dist

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
