name: Publish package

# A vX.Y.Z tag publishes that release to PyPI. A main commit publishes a preview
# wheel to the `preview` GitHub release once CI, Browser acceptance, Platform
# acceptance, and GitHub Pages pass for it. Both channels build and attest the
# package the same way.
on:
  push:
    tags:
      - "v[0-9]*.[0-9]*.[0-9]*"
  workflow_run:
    workflows: [CI, Browser acceptance, Platform acceptance, GitHub Pages]
    types: [completed]
    branches: [main]

permissions:
  actions: read
  contents: read

# Releases publish one at a time. Each main commit queues its four workflow
# completions so a pending check never replaces the one that publishes.
concurrency:
  group: >-
    ${{ github.event_name == 'push' && 'publish-release' ||
    format('publish-preview-{0}', github.event.workflow_run.head_sha) }}
  cancel-in-progress: false
  queue: max

jobs:
  resolve:
    name: Resolve publication
    if: >-
      github.event_name == 'push' ||
      (github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      channel: ${{ steps.release.outputs.channel || steps.preview.outputs.channel }}
      commit: ${{ steps.release.outputs.commit || steps.preview.outputs.commit }}
      version: ${{ steps.release.outputs.version || steps.preview.outputs.version }}
      publish: ${{ steps.release.outputs.publish || steps.preview.outputs.publish }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up uv
        if: github.event_name == 'push'
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0

      - name: Verify release commit
        id: release
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ./scripts/check-release.sh
          printf 'channel=release\ncommit=%s\nversion=%s\npublish=true\n' \
            "$GITHUB_SHA" "${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Check preview readiness
        id: preview
        if: github.event_name == 'workflow_run'
        env:
          COMMIT: ${{ github.event.workflow_run.head_sha }}
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
        run: |
          version="$(./scripts/preview-version.sh "$COMMIT")"
          printf 'channel=preview\ncommit=%s\nversion=%s\n' "$COMMIT" "$version" >> "$GITHUB_OUTPUT"
          if ! ./scripts/require-release-checks.sh "$COMMIT"; then
            echo "::notice::The $version preview waits until every main workflow passes for $COMMIT."
            echo "publish=false" >> "$GITHUB_OUTPUT"
          elif assets="$(gh release view preview --json assets --jq '.assets[].name' 2>/dev/null)" &&
            grep -qxF "marimo_studio-$version-py3-none-any.whl" <<<"$assets"; then
            echo "::notice::marimo-studio $version is already published as a preview."
            echo "publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi

  build:
    name: Build package
    needs: resolve
    if: needs.resolve.outputs.publish == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.resolve.outputs.commit }}
          persist-credentials: false

      - name: Set up uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Set the preview version
        if: needs.resolve.outputs.channel == 'preview'
        env:
          VERSION: ${{ needs.resolve.outputs.version }}
        run: uv version --package marimo-studio --no-sync "$VERSION"

      - name: Install Python dependencies
        run: uv sync --locked

      - name: Set up JavaScript workspace
        uses: ./.github/actions/setup-js
        with:
          prepare-marimo-frontend: "true"

      - name: Build and verify distributions
        run: make package

      - name: Upload distributions
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist
          path: |
            dist/marimo_studio-*.whl
            dist/marimo_studio-*.tar.gz
            dist/SHA256SUMS
          retention-days: 1
          if-no-files-found: error

  attest:
    name: Build provenance
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read
      artifact-metadata: write
      attestations: write
      contents: read
      id-token: write
    steps:
      - name: Download distributions
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist

      - name: Attest package provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/marimo_studio-*.whl
            dist/marimo_studio-*.tar.gz

  pypi:
    name: Publish to PyPI
    needs: [resolve, attest]
    if: needs.resolve.outputs.channel == 'release'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: pypi
      url: https://pypi.org/project/marimo-studio/
    permissions:
      actions: read
      contents: read
      id-token: write
    steps:
      - name: Set up uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: false
          version: "0.12.7"

      - name: Download distributions
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist

      - name: Publish package
        run: >-
          uv publish
          --trusted-publishing always
          dist/marimo_studio-*.whl
          dist/marimo_studio-*.tar.gz

  verify-pypi:
    name: Verify PyPI release
    needs: [resolve, pypi]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0

      - name: Verify the public PyPI release
        env:
          VERSION: ${{ needs.resolve.outputs.version }}
        run: ./scripts/verify-pypi.sh "$VERSION"

  release-notes:
    name: Release notes
    needs: [pypi, verify-pypi]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read
      contents: write
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download distributions
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist

      - name: Create GitHub release notes
        run: |
          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            gh release upload "${GITHUB_REF_NAME}" \
              dist/marimo_studio-*.whl \
              dist/marimo_studio-*.tar.gz \
              dist/SHA256SUMS \
              --clobber
            gh release edit "${GITHUB_REF_NAME}" \
              --draft=false \
              --verify-tag \
              --notes-file ".github/release-notes/${GITHUB_REF_NAME}.md" \
              --title "${GITHUB_REF_NAME}"
          else
            gh release create "${GITHUB_REF_NAME}" \
              dist/marimo_studio-*.whl \
              dist/marimo_studio-*.tar.gz \
              dist/SHA256SUMS \
              --verify-tag \
              --notes-file ".github/release-notes/${GITHUB_REF_NAME}.md" \
              --title "${GITHUB_REF_NAME}"
          fi
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}

  preview:
    name: Publish preview
    needs: [resolve, attest]
    if: needs.resolve.outputs.channel == 'preview'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Every preview edits the same release, so uploads, notes, and pruning run
    # one commit at a time.
    concurrency:
      group: publish-preview-release
      cancel-in-progress: false
      queue: max
    environment:
      name: preview
      url: ${{ github.server_url }}/${{ github.repository }}/releases/tag/preview
    permissions:
      actions: read
      contents: write
      pull-requests: write
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download distributions
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist

      - name: Publish the preview wheel
        env:
          COMMIT: ${{ needs.resolve.outputs.commit }}
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
        run: ./scripts/publish-preview.sh dist/marimo_studio-*.whl "$COMMIT"
