name: Browser acceptance

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    name: Browser suite (${{ matrix.name }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux 1/2 + packages
            shard: 1/2
            port_offset: 100
            packages: true
          - name: Linux 2/2
            shard: 2/2
            port_offset: 200
            packages: false
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install Python dependencies
        run: uv sync --locked --group e2e

      - name: Set up JavaScript workspace
        uses: ./.github/actions/setup-js
        with:
          prepare-marimo-frontend: "true"

      - name: Build browser assets
        run: make build

      - name: Install Chromium
        run: make _browser-install

      - name: Run browser shard
        env:
          MARIMO_STUDIO_E2E_PORT_OFFSET: ${{ matrix.port_offset }}
        run: >-
          pnpm --filter @marimo-studio/e2e exec playwright test
          --shard=${{ matrix.shard }}

      - name: Test provider browser contracts
        if: matrix.packages
        run: pnpm --filter @marimo-studio/e2e e2e:providers

      - name: Test the installed wheel in Chromium
        if: matrix.packages
        run: pnpm --filter @marimo-studio/e2e e2e:installed

      - name: Upload browser report
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: playwright-report-${{ matrix.port_offset }}
          path: |
            apps/e2e/playwright-report/
            apps/e2e/playwright-report-installed/
            apps/e2e/test-results/
          if-no-files-found: ignore
          retention-days: 7

  windows-e2e:
    name: Windows browser contracts
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up uv and Python
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
          prune-cache: false
          python-version: "3.12"

      - name: Install Python dependencies
        run: uv sync --locked --group e2e

      - name: Set up JavaScript workspace
        uses: ./.github/actions/setup-js

      - name: Prepare the pinned Marimo frontend
        run: pnpm --filter @marimo-studio/marimo-frontend prepare:upstream

      - name: Build browser assets
        run: pnpm exec vp run --filter @marimo-studio/browser build

      - name: Install Chromium
        run: pnpm --filter @marimo-studio/e2e exec playwright install chromium

      - name: Test Windows process and request ownership
        run: pnpm --filter @marimo-studio/e2e test

      - name: Test Windows view and shutdown lifecycles
        run: pnpm --filter @marimo-studio/e2e e2e:windows

      - name: Test Windows provider runtimes
        run: pnpm --filter @marimo-studio/e2e e2e:windows:providers

      - name: Test the installed wheel in Chromium
        run: pnpm --filter @marimo-studio/e2e e2e:installed

      - name: Upload Windows browser report
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: windows-playwright-report
          path: |
            apps/e2e/playwright-report/
            apps/e2e/playwright-report-installed/
            apps/e2e/test-results/
          if-no-files-found: ignore
          retention-days: 7
