name: Browser acceptance

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    name: Changes
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      pull-requests: read
    outputs:
      installed_browser: ${{ steps.selection.outputs.installed_browser }}
      main_browser: ${{ steps.selection.outputs.main_browser }}
      provider_browser: ${{ steps.selection.outputs.provider_browser }}
      windows_unit: ${{ steps.selection.outputs.windows_unit }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Find validation for the merged tree
        id: pr-validation
        uses: ./.github/actions/pr-validation
        with:
          workflow: e2e.yml

      - name: Classify changed files
        id: filter
        if: steps.pr-validation.outputs.mode == 'changed'
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          filters: .github/filters.yml
          predicate-quantifier: some-with-excludes
      - name: Select required contracts
        id: selection
        env:
          VALIDATION_MODE: ${{ steps.pr-validation.outputs.mode }}
          VALIDATION_FILTERS: '["installed_browser","main_browser","provider_browser","windows_unit"]'
          PATH_FILTERS_JSON: ${{ toJSON(steps.filter.outputs) }}
        run: node .github/actions/pr-validation/select.ts
  browser-assets:
    name: Browser and package artifacts
    needs: changes
    if:
      needs.changes.outputs.main_browser == 'true' || needs.changes.outputs.provider_browser == 'true'
      || needs.changes.outputs.installed_browser == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      wheel: ${{ steps.package.outputs.wheel }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Set up uv and Python
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
          python-version: "3.12"
      - name: Install Python dependencies
        run: uv sync --locked --group e2e
      - name: Set up JavaScript workspace
        uses: ./.github/actions/setup-js
        with:
          prepare-marimo-frontend: "true"
      - name: Prepare browser Python test payload
        run: make _prepare-browser-tests
      - name: Build and validate browser and package artifacts
        id: package
        run: |-
          make _package-build
          printf 'wheel=%s\n' "$(basename dist/marimo_studio-*.whl)" >> "$GITHUB_OUTPUT"
      - name: Upload browser assets
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: browser-assets
          path: packages/marimo-studio/src/marimo_studio/_static/browser
          retention-days: 1
          if-no-files-found: error
      - name: Upload browser package candidate
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: browser-package
          path: dist/marimo_studio-*.whl
          retention-days: 1
          if-no-files-found: error
      - name: Upload browser Python test payload
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: browser-pyodide
          path: apps/e2e/.cache/pyodide
          retention-days: 1
          if-no-files-found: error
          include-hidden-files: true

  e2e:
    name: Browser suite (${{ matrix.name }})
    needs:
      - changes
      - browser-assets
    if: >-
      needs.changes.outputs.main_browser == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux 1/6
            shard: 1/6
            shard_id: 1
          - name: Linux 2/6
            shard: 2/6
            shard_id: 2
          - name: Linux 3/6
            shard: 3/6
            shard_id: 3
          - name: Linux 4/6
            shard: 4/6
            shard_id: 4
          - name: Linux 5/6
            shard: 5/6
            shard_id: 5
          - name: Linux 6/6
            shard: 6/6
            shard_id: 6
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install Python dependencies
        run: uv sync --locked --group e2e

      - name: Set up JavaScript workspace
        uses: ./.github/actions/setup-js
      - name: Download browser assets
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: browser-assets
          path: packages/marimo-studio/src/marimo_studio/_static/browser
      - name: Download browser Python test payload
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: browser-pyodide
          path: apps/e2e/.cache/pyodide

      - name: Install Chromium
        run: make _browser-install

      - name: Run browser shard
        env:
          PLAYWRIGHT_BLOB_OUTPUT_NAME: main-linux-${{ matrix.shard_id }}.zip
        run: >-
          pnpm --filter @marimo-studio/e2e exec playwright test --shard=${{ matrix.shard }}

      - name: Upload browser report
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: playwright-report-${{ matrix.shard_id }}
          path: |
            apps/e2e/playwright-report/
            apps/e2e/playwright-report-installed/
            apps/e2e/test-results/
          if-no-files-found: ignore
          retention-days: 7
      - name: Upload browser result records
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: browser-results-linux-${{ matrix.shard_id }}
          path: apps/e2e/test-results/blob-*/**/*.zip
          retention-days: 7
          if-no-files-found: warn

  package-e2e:
    name: Provider and installed-package browser contracts
    needs:
      - changes
      - browser-assets
    if: >-
      (needs.changes.outputs.provider_browser == 'true' || needs.changes.outputs.installed_browser
      == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install Python dependencies
        run: uv sync --locked --group e2e

      - name: Set up JavaScript workspace
        uses: ./.github/actions/setup-js
      - name: Download browser assets
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: browser-assets
          path: packages/marimo-studio/src/marimo_studio/_static/browser
      - name: Download browser Python test payload
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: browser-pyodide
          path: apps/e2e/.cache/pyodide

      - name: Install Chromium
        run: make _browser-install

      - name: Set up pixi
        if: needs.changes.outputs.provider_browser == 'true'
        uses: ./.github/actions/setup-pixi

      - name: Test provider browser contracts
        if: needs.changes.outputs.provider_browser == 'true'
        run: pixi run --locked pnpm --filter @marimo-studio/e2e e2e:providers
        env:
          PLAYWRIGHT_BLOB_OUTPUT_NAME: provider-linux.zip
      - name: Download installed browser candidate
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: browser-package
          path: dist
        if: needs.changes.outputs.installed_browser == 'true'

      - name: Test the installed wheel in Chromium
        if: needs.changes.outputs.installed_browser == 'true'
        run: pnpm --filter @marimo-studio/e2e e2e:installed
        env:
          MARIMO_STUDIO_E2E_WHEEL: ${{ github.workspace }}/dist/${{ needs.browser-assets.outputs.wheel }}
          PLAYWRIGHT_BLOB_OUTPUT_NAME: installed-linux.zip

      - name: Upload browser report
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: playwright-report-packages
          path: |
            apps/e2e/playwright-report/
            apps/e2e/playwright-report-installed/
            apps/e2e/test-results/
          if-no-files-found: ignore
          retention-days: 7
      - name: Upload browser result records
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: browser-results-package-e2e
          path: apps/e2e/test-results/blob-*/**/*.zip
          retention-days: 7
          if-no-files-found: warn

  windows-unit:
    name: Windows process unit contracts
    needs: changes
    if: >-
      needs.changes.outputs.windows_unit == 'true'
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up uv and Python
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
          prune-cache: false
          python-version: "3.12"

      - name: Install Python dependencies
        run: uv sync --locked --group e2e

      - name: Set up JavaScript workspace
        uses: ./.github/actions/setup-js

      - name: Test Windows process and request ownership
        run: pnpm --filter @marimo-studio/e2e test

  reports:
    name: Browser reports
    needs:
      - e2e
      - package-e2e
    if: "!cancelled() && (needs.e2e.result == 'success' || needs.e2e.result == 'failure' ||
      needs.package-e2e.result == 'success' || needs.package-e2e.result == 'failure')"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Set up JavaScript workspace
        uses: ./.github/actions/setup-js
      - name: Download browser result records
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          pattern: browser-results-*
          path: browser-results
          merge-multiple: true
      - name: Merge browser reports
        run: >-
          mkdir merged-blobs

          find browser-results -name '*.zip' -exec cp {} merged-blobs/ \;

          pnpm --filter @marimo-studio/e2e exec playwright merge-reports --config
          playwright.merge.config.ts "${{ github.workspace }}/merged-blobs"
      - name: Upload merged browser report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: browser-report
          path: apps/e2e/playwright-report
          retention-days: 7
          if-no-files-found: error

  gate:
    name: Browser acceptance gate
    if: always()
    needs:
      - changes
      - e2e
      - package-e2e
      - windows-unit
      - browser-assets
      - reports
    runs-on: ubuntu-latest
    timeout-minutes: 1
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Confirm browser acceptance results
        env:
          CHANGES: ${{ needs.changes.result }}
          E2E_REQUIRED: ${{ needs.changes.outputs.main_browser == 'true' }}
          E2E: ${{ needs.e2e.result }}
          PACKAGE_E2E_REQUIRED: ${{ (needs.changes.outputs.provider_browser == 'true' ||
            needs.changes.outputs.installed_browser == 'true') }}
          PACKAGE_E2E: ${{ needs.package-e2e.result }}
          WINDOWS_UNIT_REQUIRED: ${{ needs.changes.outputs.windows_unit == 'true' }}
          WINDOWS_UNIT: ${{ needs.windows-unit.result }}
          BROWSER_ASSETS_REQUIRED: ${{ needs.changes.outputs.main_browser == 'true' ||
            needs.changes.outputs.provider_browser == 'true' ||
            needs.changes.outputs.installed_browser == 'true' }}
          BROWSER_ASSETS: ${{ needs.browser-assets.result }}
          REPORTS_REQUIRED: ${{ needs.e2e.result == 'success' || needs.e2e.result == 'failure' ||
            needs.package-e2e.result == 'success' || needs.package-e2e.result == 'failure' }}
          REPORTS: ${{ needs.reports.result }}
        run: |
          scripts/check-workflow-results.sh \
            Changes true "$CHANGES" \
            Browser-assets "$BROWSER_ASSETS_REQUIRED" "$BROWSER_ASSETS" \
            Reports "$REPORTS_REQUIRED" "$REPORTS" \
            Browser "$E2E_REQUIRED" "$E2E" \
            Package-browser "$PACKAGE_E2E_REQUIRED" "$PACKAGE_E2E" \
            Windows-unit "$WINDOWS_UNIT_REQUIRED" "$WINDOWS_UNIT"
