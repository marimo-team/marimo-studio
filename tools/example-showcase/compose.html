<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>marimo-studio example wall</title>
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/@fontsource-variable/inter@5/index.css"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/@fontsource/jetbrains-mono@5/400.css"
    />
    <style>
      :root {
        --card-bg: #fff;
        --card-border: rgb(20 30 25 / 12%);
        --chrome: #fbfbfa;
        --chrome-rule: rgb(20 30 25 / 8%);
        --label: #3c4043;
        --muted: #8a8f94;
        --notebook-chrome: #eef5f2;
        --notebook-label: #1d7363;
        --shadow:
          0 0 0 1px rgb(20 30 25 / 4%), 0 2px 4px rgb(20 30 25 / 5%),
          0 18px 36px -12px rgb(20 30 25 / 18%), 0 48px 96px -32px rgb(20 30 25 / 26%);
      }

      body[data-theme="dark"] {
        --card-bg: #111;
        --card-border: rgb(255 255 255 / 12%);
        --chrome: #1b1d1f;
        --chrome-rule: rgb(255 255 255 / 8%);
        --label: #e3e5e8;
        --muted: #8f959b;
        --notebook-chrome: #1f2a26;
        --notebook-label: #cad996;
        --shadow:
          0 0 0 1px rgb(0 0 0 / 40%), 0 2px 4px rgb(0 0 0 / 30%),
          0 18px 36px -12px rgb(0 0 0 / 55%), 0 48px 96px -32px rgb(0 0 0 / 70%);
      }

      html,
      body {
        margin: 0;
        background: transparent;
      }

      #canvas {
        position: relative;
        width: 2400px;
        height: var(--height);
        overflow: hidden;
        perspective: var(--perspective);
        perspective-origin: 50% 42%;
        font-family: "Inter Variable", system-ui, sans-serif;
        /* The wall bleeds past the frame, so its edges fade out. */
        mask-image:
          linear-gradient(to bottom, #000 84%, transparent 100%),
          linear-gradient(to right, transparent 0%, #000 7%, #000 93%, transparent 100%);
        mask-composite: intersect;
      }

      .plane {
        position: absolute;
        left: 50%;
        top: 50%;
        display: grid;
        grid-auto-flow: column;
        gap: var(--gap);
        transform-style: preserve-3d;
        transform: translate(-50%, -50%) var(--plane);
      }

      .column {
        display: grid;
        gap: var(--gap);
        align-content: start;
      }

      .card {
        box-sizing: border-box;
        display: flex;
        flex-direction: column;
        width: var(--card);
        height: calc(var(--card) * var(--aspect) + 34px);
        overflow: hidden;
        border: 1px solid var(--card-border);
        border-radius: 12px;
        background: var(--card-bg);
        box-shadow: var(--shadow);
      }

      .card header {
        display: flex;
        flex: 0 0 auto;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
        height: 34px;
        padding: 0 16px;
        border-bottom: 1px solid var(--chrome-rule);
        background: var(--chrome);
        color: var(--label);
        font-size: 13px;
        font-weight: 550;
        letter-spacing: -0.005em;
      }

      .card header span:last-child {
        color: var(--muted);
        font-size: 12px;
        font-weight: 450;
      }

      .card.is-notebook header {
        background: var(--notebook-chrome);
        color: var(--notebook-label);
      }

      .card.is-notebook header span:last-child {
        font:
          400 12px "JetBrains Mono",
          ui-monospace,
          monospace;
      }

      .card img {
        display: block;
        width: 100%;
        flex: 1 1 auto;
        min-height: 0;
        object-fit: cover;
        object-position: top center;
      }
    </style>
  </head>
  <body>
    <div id="canvas"><div class="plane"></div></div>
    <script type="module">
      // render.ts provides the theme, the canvas height, the camera, the wall
      // geometry in card widths, and one column of cards per example family.
      const { camera, columns, geometry, height, theme } = window.wall;
      const card = 640;
      document.body.dataset.theme = theme;
      Object.entries({
        "--aspect": String(geometry.aspect),
        "--card": `${card}px`,
        "--gap": `${geometry.gap * card}px`,
        "--height": `${height}px`,
        "--perspective": `${geometry.perspective * card}px`,
        "--plane": `translate3d(${camera.x}px, ${camera.y}px, ${camera.z}px) rotateX(${geometry.rotateX}deg) rotateZ(${geometry.rotateZ}deg)`,
      }).forEach(([name, value]) => document.documentElement.style.setProperty(name, value));

      const plane = document.querySelector(".plane");
      for (const pages of columns) {
        const column = document.createElement("div");
        column.className = "column";
        for (const { detail, label, notebook, shot } of pages) {
          const element = document.createElement("section");
          element.className = notebook ? "card is-notebook" : "card";
          const header = document.createElement("header");
          header.append(
            ...[label, detail].map((text) => {
              const span = document.createElement("span");
              span.textContent = text;
              return span;
            }),
          );
          const image = document.createElement("img");
          image.alt = "";
          image.src = shot;
          element.append(header, image);
          column.append(element);
        }
        plane.append(column);
      }

      await Promise.all([...document.images].map((image) => image.decode().catch(() => undefined)));
      await document.fonts.ready;
      document.body.dataset.ready = "true";
    </script>
  </body>
</html>
