<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Prepared runtime fixture</title>
    <link rel="stylesheet" href="app.css" />
  </head>
  <body>
    <main id="app-shell" class="prepared-view">
      <header>
        <p class="eyebrow">Zero-Python</p>
        <h1>Prepared runtime fixture</h1>
        <p>One immutable state supplies the cell, output, and value projections together.</p>
      </header>

      <section aria-labelledby="state-heading">
        <h2 id="state-heading">Prepared state</h2>
        <p>Metric: <strong id="prepared-metric" mo-value="metric"></strong></p>
        <marimo-output id="prepared-summary" value="rich_summary"></marimo-output>
      </section>

      <section aria-labelledby="controls-heading">
        <h2 id="controls-heading">Native controls</h2>
        <marimo-cell name="controls"></marimo-cell>
        <marimo-output
          id="prepared-scale-output"
          value="scale"
          aria-label="Prepared scale"
        ></marimo-output>
        <p>Submitted region: <strong id="prepared-region" mo-value="selected_region"></strong></p>
        <div class="duplicate-controls">
          <marimo-cell name="filters_control"></marimo-cell>
          <marimo-output id="prepared-filter-output" value="filters"></marimo-output>
        </div>
      </section>

      <section aria-labelledby="metric-cell-heading">
        <h2 id="metric-cell-heading">Complete cell console</h2>
        <marimo-cell name="metric"></marimo-cell>
      </section>

      <section aria-labelledby="widget-heading">
        <h2 id="widget-heading">Browser-local widget</h2>
        <marimo-cell name="counter_widget"></marimo-cell>
      </section>
    </main>
  </body>
</html>
