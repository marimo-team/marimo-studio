<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Revenue at a glance</title>
    <link rel="stylesheet" href="app.css" />
    <script type="module" src="app.js"></script>
  </head>
  <body>
    <main id="app-shell" class="studio-view">
      <marimo-output value="lens"></marimo-output>
      <header class="grid items-end gap-8 border-b border-border pb-10 lg:grid-cols-3">
        <div class="lg:col-span-2">
          <p class="studio-eyebrow mb-3">Quarterly review</p>
          <h1 class="m-0 max-w-[12ch] font-heading text-[clamp(2.8rem,8vw,5.8rem)] leading-[0.96] font-semibold tracking-tight text-balance">
            Revenue at a glance
          </h1>
          <p class="mt-5 max-w-2xl text-base leading-7 text-muted-foreground">
            Explore the forecast while the notebook remains live behind the page.
          </p>
        </div>
        <div class="grid gap-6">
          <dl class="m-0 grid grid-cols-2 gap-6 lg:grid-cols-1">
            <div>
              <dt class="studio-eyebrow mb-1">Scenario</dt>
              <dd class="m-0 font-semibold" mo-value="report.scenario"></dd>
            </div>
            <div>
              <dt class="studio-eyebrow mb-1">Updated</dt>
              <dd class="m-0 font-semibold"><time mo-value="report.updated_at"></time></dd>
            </div>
          </dl>
          <div class="flex flex-wrap items-center gap-3">
            <span id="briefing-data" hidden mo-value="report"></span>
            <button
              id="copy-briefing"
              class="studio-button w-fit [&>iconify-icon]:size-4"
              type="button"
              disabled
            >
              <iconify-icon icon="lucide:clipboard-copy" aria-hidden="true"></iconify-icon>
              Copy briefing
            </button>
            <span
              id="copy-status"
              class="min-h-5 text-sm text-muted-foreground"
              role="status"
            ></span>
          </div>
        </div>
      </header>

      <section
        class="grid items-center gap-6 border-b border-border py-8 lg:grid-cols-3"
        aria-labelledby="controls-title"
      >
        <div>
          <p class="studio-eyebrow mb-2">Model inputs</p>
          <h2 id="controls-title" class="m-0 flex items-center gap-2 text-xl font-semibold">
            <iconify-icon icon="lucide:sliders-horizontal" aria-hidden="true"></iconify-icon>
            Adjust the outlook
          </h2>
        </div>
        <marimo-cell
          class="min-w-0 [--marimo-cell-padding:0] [--marimo-cell-skeleton-height:4rem] lg:col-span-2"
          name="controls"
        ></marimo-cell>
      </section>

      <section class="grid border-b border-border md:grid-cols-3" aria-label="Forecast summary">
        <article class="py-7 md:pr-7">
          <p class="m-0 text-sm text-muted-foreground">Projected revenue</p>
          <strong
            class="mt-3 block min-h-[1em] font-heading text-4xl leading-none font-semibold tracking-[-0.045em] [--marimo-value-skeleton-width:8ch]"
            mo-value="report.total"
          ></strong>
        </article>
        <article class="border-t border-border py-7 md:border-l md:border-t-0 md:px-7">
          <p class="m-0 text-sm text-muted-foreground">Change from baseline</p>
          <strong
            class="mt-3 block min-h-[1em] font-heading text-4xl leading-none font-semibold tracking-[-0.045em] [--marimo-value-skeleton-width:8ch]"
            mo-value="report.change"
          ></strong>
        </article>
        <article class="border-t border-border py-7 md:border-l md:border-t-0 md:pl-7">
          <p class="m-0 text-sm text-muted-foreground">Forecast period</p>
          <strong
            class="mt-3 block min-h-[1em] font-heading text-4xl leading-none font-semibold tracking-[-0.045em] [--marimo-value-skeleton-width:8ch]"
            mo-value="report.through"
          ></strong>
        </article>
      </section>

      <section class="mt-10 grid gap-6 lg:grid-cols-5">
        <article class="studio-card min-w-0 p-6 lg:col-span-2" aria-labelledby="summary-title">
          <p class="studio-eyebrow mb-2">Interpretation</p>
          <h2 id="summary-title" class="m-0 mb-5 flex items-center gap-2 text-xl font-semibold">
            <iconify-icon icon="lucide:scan-search" aria-hidden="true"></iconify-icon>
            What the model says
          </h2>
          <marimo-output
            class="min-w-0 [--marimo-cell-padding:0] [--marimo-cell-skeleton-height:8rem]"
            value="summary"
          ></marimo-output>
        </article>

        <article class="studio-card min-w-0 p-6 lg:col-span-3" aria-labelledby="table-title">
          <p class="studio-eyebrow mb-2">Quarterly detail</p>
          <h2 id="table-title" class="m-0 mb-5 flex items-center gap-2 text-xl font-semibold">
            <iconify-icon icon="lucide:table-2" aria-hidden="true"></iconify-icon>
            Projection by quarter
          </h2>
          <marimo-output
            class="min-w-0 overflow-x-auto [--marimo-cell-padding:0] [--marimo-cell-skeleton-height:18rem]"
            value="revenue_table"
          ></marimo-output>
        </article>
      </section>
    </main>
  </body>
</html>
